# X Media Downloader Configuration

# Download destination (only path outside project)
download_dir: "~/Downloads/x-media"

# Database path (relative to project root)
db_path: "downloads.db"

# Telegram notification
telegram:
  enabled: true
  bot_token: "YOUR_BOT_TOKEN"
  chat_id: "YOUR_CHAT_ID"

# gallery-dl settings (free, uses browser cookies)
gallery_dl:
  cookies_file: "twitter-cookies.txt"
  bin: "gallery-dl"
  likes_per_fetch: 100
